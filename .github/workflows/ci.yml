name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node:
    name: node-${{ matrix.node-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [18]
        include:
          - os: ubuntu-latest
            node-version: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: git diff --check

  rust-spike:
    name: rust-spike-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path spikes/rust-direct-core/Cargo.toml -- --check
      - run: cargo run --manifest-path spikes/rust-direct-core/Cargo.toml

  official-core-smoke:
    name: official-core-aidisk-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Integration
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download official Core release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aidisk"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/quzhiii/ai-disk-doctor/releases/download/v1.8.0/aidisk-v1.8.0-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/aidisk/aidisk-v1.8.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/quzhiii/ai-disk-doctor/releases/download/v1.8.0/aidisk-v1.8.0-x86_64-unknown-linux-gnu.sha256" \
            --output "$RUNNER_TEMP/aidisk/aidisk.sha256"
          (cd "$RUNNER_TEMP/aidisk" && sha256sum --check aidisk.sha256)
          tar -xzf "$RUNNER_TEMP/aidisk/aidisk-v1.8.0-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/aidisk"
      - name: Real AIDISK_EXE smoke against official Core release baseline
        env:
          AIDISK_EXE: ${{ runner.temp }}/aidisk/aidisk-v1.8.0-x86_64-unknown-linux-gnu/aidisk
        run: npm test
